<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' 
  fill='%23a99145'/%3E%3Ctext x='16' y='23' font-family='Georgia' font-size='20' text-anchor='middle' fill='white'%3EN%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
  <title>Catálogo de Noticias · NexoNoticias</title>
  <meta name="description" content="Catálogo de noticias de política, tecnología, deportes y cultura de Colombia.">
</head>
<body>
  <a class="salto" href="#contenido">Saltar al contenido</a>
  <header class="site-header" id="header"></header>
  <main id="contenido">
    <section class="cabecera-pagina">
      <div class="contenedor">
        <div class="cabecera-fila">
          <div><h1>Catálogo de Noticias</h1><p class="sub">Mantente al día con lo más relevante de Colombia</p></div>
          <form class="buscador-catalogo" id="form-buscar" role="search">
            <svg class="icono" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><label class="visualmente-oculto" 
            for="buscar">Buscar noticias</label>
            <input id="buscar" type="search" placeholder="Buscar política, cultura, tecnología..." autocomplete="off">
          </form>
        </div>
        <div class="pildoras" id="pildoras" role="group" aria-label="Filtrar por categoría"></div>
      </div>
    </section>
    <section class="catalogo-fondo">
      <div class="contenedor">
        <p class="contador-resultados" id="contador" aria-live="polite"></p>
        <div class="grid-tarjetas" id="listado"><p>Cargando noticias…</p></div>
      </div>
    </section>
  </main>
  <footer class="site-footer" id="footer"></footer>
  <noscript><p style="padding:16px;text-align:center">NexoNoticias necesita JavaScript activado para mostrar las noticias.</p></noscript>
  <script type="module" src="js/pages/noticias.js"></script>
</body>
</html>
